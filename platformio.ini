; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ZuluSCSI_RP2040

[env]
build_flags =
    -DBUILD_ENV=$PIOENV

; ZuluSCSI settings shared among Raspberry Pi microcontroller like the RP2040 and RP2350
[env:ZuluSCSI_RP2MCU]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#6164ed92d83c1241a1d84ad848158d7b0fb486e3
platform_packages =
    framework-arduinopico@https://github.com/rabbitholecomputing/arduino-pico.git#v5.4.2-DaynaPORT
extra_scripts =
    src/build_bootloader.py
framework = arduino
lib_ldf_mode = chain+
lib_deps =
    SdFat=https://github.com/greiman/SdFat#2.2.3
    minIni
    SCSI2SD
    ZuluContainerFS=https://github.com/rabbitholecomputing/ZuluContainerFS.git
    CUEParser=https://github.com/rabbitholecomputing/CUEParser
    ZuluSCSI_platform_RP2MCU
build_flags =
    ${env.build_flags}
    -O2 -Isrc
    -Wall -Wno-sign-compare -Wno-ignored-qualifiers -Wno-overloaded-virtual
    -DSPI_DRIVER_SELECT=3
    -DSD_CHIP_SELECT_MODE=2
    -DENABLE_DEDICATED_SPI=1
    -DHAS_SDIO_CLASS
    -DUSE_ARDUINO=1
    -DPICO_FLASH_SPI_CLKDIV=2
    -DPLATFORM_MASS_STORAGE
    -DCONTAINER_IMAGE_SUPPORT
    -DFILE_COPY_CONSTRUCTOR_SELECT=FILE_COPY_CONSTRUCTOR_PUBLIC
    -DDISABLE_FS_H_WARNING
    -DRECLOCKING_SUPPORTED
    -DROMDRIVE_OFFSET=1273856
    -DPICO_CYW43_ARCH_POLL=1
    -DCYW43_PIN_WL_DYNAMIC=1
    -DCYW43_LWIP=0
    -DCYW43_USE_OTP_MAC=0

; Original RP2040 configuration
[env:ZuluSCSI_RP2040]
extends = env:ZuluSCSI_RP2MCU
board = zuluscsi_rp2040
program_flash_allocation = 1244k
linker_script_template = src/rp204x-template.ld
ldscript_bootloader = src/bootloader_rp2040.bin
lib_ignore = SDIO_RP2350
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.1
    ZuluSCSI_UI_RP2MCU
    ZuluSCSI_audio_RP2MCU
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_RP2040
    -DZULUSCSI_MCU_RP20XX
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_SPDIF
    -DCONTROL_BOARD
    -DSSD1306_NO_SPLASH
    -DLOGBUFSIZE=8192

; Rest of the original file (other environments) kept to satisfy dependencies
[env:ZuluSCSI_Pico]
extends = env:ZuluSCSI_RP2MCU
board = pico
linker_script_template = src/rp204x-template.ld
ldscript_bootloader = src/bootloader_rp2040.bin
lib_ignore = SDIO_RP2350
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_RP2040
    -DZULUSCSI_MCU_RP20XX

[env:ZuluSCSI_Pico_DaynaPORT]
extends = env:ZuluSCSI_Pico
build_flags =
    ${env:ZuluSCSI_Pico.build_flags}
    -DDAYNAPORT_SUPPORT

[env:ZuluSCSI_Pico_2]
extends = env:ZuluSCSI_RP2MCU
board = pico_2
linker_script_template = src/rp23xx-template.ld
ldscript_bootloader = src/bootloader_rp23xx.bin
lib_ignore = SDIO_RP2040
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_MCU_RP23XX

[env:ZuluSCSI_Pico_2_DaynaPORT]
extends = env:ZuluSCSI_Pico_2
build_flags =
    ${env:ZuluSCSI_Pico_2.build_flags}
    -DDAYNAPORT_SUPPORT

[env:ZuluSCSI_Blaster]
extends = env:ZuluSCSI_RP2MCU
board = zuluscsi_blaster
linker_script_template = src/rp23xx-template.ld
ldscript_bootloader = src/bootloader_rp23xx.bin
lib_ignore = SDIO_RP2040
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
    compact25519=https://github.com/rabbitholecomputing/compact25519
    ZuluSCSI_UI_RP2MCU
    ZuluSCSI_audio_RP2MCU
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_BLASTER
    -DZULUSCSI_MCU_RP23XX
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DRP2MCU_SCSI_ACCEL_WIDE
    -DSD_USE_RP2350_SDIO
    -DPICO_RP2350A=1
    -DCONTROL_BOARD

[env:ZuluSCSI_Wide]
extends = env:ZuluSCSI_RP2MCU
board = zuluscsi_wide
linker_script_template = src/rp23xx-template.ld
ldscript_bootloader = src/bootloader_rp23xx.bin
lib_ignore = SDIO_RP2040
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
    RP2350_Logic_Sniffer=https://github.com/rabbitholecomputing/RP2350_Logic_Sniffer#1.0.1
    compact25519=https://github.com/rabbitholecomputing/compact25519
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.1
    ZuluSCSI_UI_RP2MCU
    ZuluSCSI_audio_RP2MCU
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_WIDE
    -DZULUSCSI_MCU_RP23XX
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DRP2MCU_SCSI_ACCEL_WIDE
    -DSD_USE_RP2350_SDIO
    -DPICO_RP2350A=0
    -DCONTROL_BOARD
    -DSSD1306_NO_SPLASH
